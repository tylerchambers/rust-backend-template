[project]
name = "rust-backend-template-tooling"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "prometheus-client==0.24.1",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
required-version = "==0.17.4"
target-version = "py314"
include = ["scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]
