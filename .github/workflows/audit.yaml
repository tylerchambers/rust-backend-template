name: Dependency audit
on:
  pull_request:
    paths: &audit-inputs
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/package.json'
      - bun.lock
      - deny.toml
      - rust-toolchain.toml
      - .bun-version
      - justfile
      - .github/actions/toolchain/action.yaml
      - .github/workflows/audit.yaml
  push:
    branches: [main]
    paths: *audit-inputs
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: just audit
