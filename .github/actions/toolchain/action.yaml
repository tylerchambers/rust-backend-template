name: Set up the toolchain
description: Install the repository's Rust and Bun versions and the just command runner.
runs:
  using: composite
  steps:
    - name: Install Rust with the repository's components
      shell: bash
      run: env -u RUSTUP_TOOLCHAIN rustup toolchain install --no-self-update
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      with:
        just-version: '1.59.0'
