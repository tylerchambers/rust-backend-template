# PostgreSQL and SMTP are operator-managed services outside this project.
name: rust-backend-template-prod

x-backend: &backend
  image: ${BACKEND_IMAGE:?set reviewed backend image reference with sha256 digest}
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-runtime: &runtime
  DATABASE_URL: ${DATABASE_URL:?nonowner NOBYPASSRLS runtime credential required}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?canonical HTTPS origin required}
  ENVIRONMENT: production
  MAIL_MODE: smtp
  SMTP_HOST: ${SMTP_HOST:?required}
  SMTP_USERNAME: ${SMTP_USERNAME:?required}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?required}
  SMTP_FROM: ${SMTP_FROM:?required}

services:
  migrate:
    <<: *backend
    command: ["migrate"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?separate deployment credential required}
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *runtime
      BIND_ADDRESS: 0.0.0.0:8080
      # A value-less key is omitted from the container when unset.
      REDIS_URL:
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment: *runtime
    restart: unless-stopped
    stop_grace_period: 30s

  caddy:
    image: docker.io/library/caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on: [api]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?canonical HTTPS origin required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
