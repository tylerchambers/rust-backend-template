<!doctype html><meta charset="utf-8"><title>Confirm sign in</title><button id="confirm">Confirm sign in</button><pre id="result"></pre><script>let token='';function capture(){if(location.hash){token=location.hash.slice(1);history.replaceState(null,'',location.pathname);}}capture();addEventListener('hashchange',capture);document.getElementById('confirm').onclick=async()=>{const r=await fetch('/v1/auth/confirm',{method:'POST',headers:{'content-type':'application/json','x-csrf-token':(document.cookie.split('; ').find(v=>v.startsWith('csrf='))?.slice(5)??'')},body:JSON.stringify({token})});document.getElementById('result').textContent=r.ok?'Signed in':'Link invalid or expired';};</script>
