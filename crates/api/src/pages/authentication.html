<!doctype html>
<meta charset="utf-8">
<title>Confirm sign in</title>
<button id="confirm" disabled>Confirm sign in</button>
<pre id="result"></pre>
<p><a href="/">Open Project desk</a></p>
<script>
const button = document.getElementById('confirm');
const result = document.getElementById('result');
let token = '';
let revision = 0;
function capture() {
    revision++;
    token = location.hash.slice(1);
    history.replaceState(null,'',location.pathname);
    result.textContent = '';
    button.disabled = !token;
}
capture();
addEventListener('hashchange', event => {
    if (event.newURL === location.href) capture();
});
button.onclick = async () => {
    const submitted = revision;
    button.disabled = true;
    try {
        const response = await fetch('/v1/auth/confirm', {
            method: 'POST',
            headers: {
                'content-type': 'application/json',
                'x-csrf-token': document.cookie.split('; ').find(v => v.startsWith('csrf='))?.slice(5) ?? ''
            },
            body: JSON.stringify({token})
        });
        if (submitted === revision) result.textContent = response.ok ? 'Signed in' : 'Link invalid or expired';
    } catch {
        if (submitted === revision) result.textContent = 'Could not reach the server';
    } finally {
        if (submitted === revision) button.disabled = false;
    }
};
</script>
