<!doctype html><meta charset="utf-8"><title>Accept invitation</title><p>Sign in as the invited email address first.</p><button id="accept">Accept invitation</button><pre id="result"></pre><script>const [org,id,token]=location.hash.slice(1).split(':');history.replaceState(null,'',location.pathname);document.getElementById('accept').onclick=async()=>{const r=await fetch('/v1/organizations/'+encodeURIComponent(org)+'/invitations/'+encodeURIComponent(id)+'/accept',{method:'POST',headers:{'content-type':'application/json','x-csrf-token':(document.cookie.split('; ').find(v=>v.startsWith('csrf='))?.slice(5)??'')},body:JSON.stringify({token})});document.getElementById('result').textContent=r.ok?'Accepted':'Sign in or request a new invitation';};</script>
