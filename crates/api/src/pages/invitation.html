<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organization invitation · Project desk</title>
<link rel="stylesheet" href="/assets/desk.css">
</head>
<body class="confirmation">
<main>
<h1>Organization invitation</h1>
<p><a href="/" target="_blank" rel="noopener noreferrer">Sign in to Project desk (new tab)</a> with the invited email address, then return here.</p>
<button id="accept" disabled>Accept invitation</button>
<p id="result" role="status"></p>
</main>
<script>
const button = document.getElementById('accept');
const result = document.getElementById('result');
let invitation;
function capture() {
    invitation = location.hash.slice(1).split(':');
    history.replaceState(null,'',location.pathname);
    result.textContent = '';
    button.disabled = invitation.length !== 3 || invitation.some(part => !part);
}
capture();
addEventListener('hashchange', event => {
    if (event.newURL === location.href) capture();
});
button.onclick = async () => {
    const submitted = invitation;
    const [org, id, token] = submitted;
    button.disabled = true;
    try {
        const response = await fetch('/v1/organizations/' + encodeURIComponent(org) + '/invitations/' + encodeURIComponent(id) + '/accept', {
            method: 'POST',
            headers: {
                'content-type': 'application/json',
                'x-csrf-token': document.cookie.split('; ').find(v => v.startsWith('csrf='))?.slice(5) ?? ''
            },
            body: JSON.stringify({token})
        });
        if (submitted === invitation) result.textContent = response.ok ? 'Accepted' : 'Sign in or request a new invitation';
    } catch {
        if (submitted === invitation) result.textContent = 'Could not reach the server';
    } finally {
        if (submitted === invitation) button.disabled = false;
    }
};
</script>
</body>
</html>
