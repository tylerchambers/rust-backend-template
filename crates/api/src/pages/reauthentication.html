<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email proof · Project desk</title>
<link rel="stylesheet" href="/assets/desk.css">
</head>
<body class="confirmation">
<main>
<h1>Email proof</h1>
<p>Check the action and target in your email. Paste the proof in the tab that requested it.</p>
<button id="show" disabled>Confirm and reveal proof</button>
<p id="proof" role="status"></p>
</main>
<script>
const button = document.getElementById('show');
const result = document.getElementById('proof');
let proof = '';
function capture() {
    proof = location.hash.slice(1);
    history.replaceState(null,'',location.pathname);
    result.textContent = '';
    button.disabled = !proof;
}
capture();
addEventListener('hashchange', event => {
    if (event.newURL === location.href) capture();
});
button.onclick = () => { result.textContent = proof; };
</script>
</body>
</html>
