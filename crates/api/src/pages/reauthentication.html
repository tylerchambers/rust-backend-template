<!doctype html>
<meta charset="utf-8">
<title>Privileged operation confirmation</title>
<p>Return this proof to the requesting client. Only its CSRF-protected privileged POST can consume it. Check the action and target in your email before proceeding.</p>
<button id="show" disabled>Confirm and reveal proof</button>
<pre id="proof"></pre>
<script>
const button = document.getElementById('show');
const result = document.getElementById('proof');
let proof = '';
function capture() {
    proof = location.hash.slice(1);
    history.replaceState(null,'',location.pathname);
    result.textContent = '';
    button.disabled = !proof;
}
capture();
addEventListener('hashchange', event => {
    if (event.newURL === location.href) capture();
});
button.onclick = () => { result.textContent = proof; };
</script>
