[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/api", "crates/bootstrap", "apps/server", "apps/worker", "apps/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# All first-party crates opt in with [lints] workspace = true.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
api = { path = "crates/api" }
bootstrap = { path = "crates/bootstrap" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
riverqueue = "=0.6.0"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.11"
rand = "0.10"
hex = "0.4"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
