services:
  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: template
      POSTGRES_PASSWORD: local-template-test
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
  mailpit:
    image: docker.io/axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports: ["127.0.0.1:51029:1025", "127.0.0.1:58029:8025"]
  redis:
    image: docker.io/library/redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    ports: ["127.0.0.1:56379:6379"]
    profiles: ["redis"]
# Development credentials only. Migration/runtime role provisioning is explicit.
